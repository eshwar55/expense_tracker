<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="navbar">
    <h2>💰 Expense Tracker</h2>
    <div>
        <button onclick="toggleDarkMode()">🌙</button>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

    <!-- Summary -->
    <div class="summary">
        <div class="card income">Income ₹<span id="totalIncome">0</span></div>
        <div class="card expense">Expense ₹<span id="totalExpense">0</span></div>
        <div class="card balance">Balance ₹<span id="balance">0</span></div>
    </div>

    <!-- Add Transaction -->
    <form id="expenseForm">
        <input type="text" id="title" placeholder="Title" required>
        <input type="number" id="amount" placeholder="Amount" required>
        <input type="date" id="date" required>

        <select id="category">
            <option>Food</option>
            <option>Rent</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Salary</option>
        </select>

        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <button>Add</button>
    </form>

    <!-- Filters -->
    <div class="filters">
        <select id="filterCategory" onchange="renderTransactions()">
            <option value="all">All Categories</option>
            <option>Food</option>
            <option>Rent</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Salary</option>
        </select>

        <input type="month" id="filterMonth" onchange="renderTransactions()">
        <button onclick="exportCSV()">Export CSV</button>
    </div>

    <!-- Chart -->
    <canvas id="expenseChart"></canvas>

    <!-- List -->
    <ul id="transactionList"></ul>

</div>

<script src="script.js"></script>
<script src="pwa.js"></script>
</body>
</html>
